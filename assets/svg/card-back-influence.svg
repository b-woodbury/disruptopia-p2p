<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280" role="img" aria-label="Influence card back">
  <defs>
    <linearGradient id="ibg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.55" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="iglow" cx="0.5" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <pattern id="igrid" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
      <line x1="0" y1="0" x2="0" y2="22" stroke="#fbbf24" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="200" height="280" rx="14" fill="url(#ibg)"/>
  <rect x="0" y="0" width="200" height="280" rx="14" fill="url(#igrid)"/>
  <rect x="0" y="0" width="200" height="280" rx="14" fill="url(#iglow)"/>
  <rect x="8" y="8" width="184" height="264" rx="9" fill="none" stroke="#faf7f2" stroke-width="1.2" stroke-opacity="0.6"/>
  <rect x="12" y="12" width="176" height="256" rx="7" fill="none" stroke="#faf7f2" stroke-width="0.6" stroke-opacity="0.35"/>

  <!-- Megaphone icon centred -->
  <g transform="translate(100 130) rotate(-15)" stroke="#7c2d12" stroke-width="2" stroke-linejoin="round">
    <!-- Cone -->
    <path d="M-50 -25 L 35 -45 L 35 45 L -50 25 Z" fill="#fef3c7"/>
    <!-- Mouthpiece end -->
    <rect x="-65" y="-15" width="20" height="30" rx="3" fill="#fbbf24"/>
    <!-- Handle -->
    <rect x="-12" y="20" width="6" height="22" rx="2" fill="#7c2d12"/>
    <!-- Sound waves -->
    <g fill="none" stroke="#faf7f2" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
      <path d="M45 -25 Q 55 0 45 25"/>
      <path d="M55 -38 Q 72 0 55 38"/>
      <path d="M65 -50 Q 88 0 65 50"/>
    </g>
  </g>

  <!-- Title banner -->
  <rect x="20" y="232" width="160" height="30" rx="4" fill="#7c2d12" stroke="#faf7f2" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="100" y="252" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="16" font-weight="bold" fill="#fef3c7" letter-spacing="3">INFLUENCE</text>

  <!-- Corner accents -->
  <g fill="#fde68a" fill-opacity="0.85">
    <circle cx="20" cy="20" r="2.5"/>
    <circle cx="180" cy="20" r="2.5"/>
    <circle cx="20" cy="220" r="2.5"/>
    <circle cx="180" cy="220" r="2.5"/>
  </g>
</svg>
