<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Presence flag">
  <!-- Base shadow -->
  <ellipse cx="8" cy="22" rx="4.5" ry="1" fill="#1e1b18" fill-opacity="0.2"/>
  <!-- Pole -->
  <line x1="8" y1="3" x2="8" y2="22" stroke="#1e1b18" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Flag (currentColor) -->
  <path d="M8 4 L 20 7 L 8 11 Z"
        fill="currentColor" stroke="#1e1b18" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- Pole top knob -->
