<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Train model" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Neural network: 3 input nodes, 2 hidden, 2 output -->
  <!-- Connections -->
  <g stroke-opacity="0.7">
    <line x1="6" y1="7" x2="14" y2="11"/>
    <line x1="6" y1="7" x2="14" y2="21"/>
    <line x1="6" y1="16" x2="14" y2="11"/>
    <line x1="6" y1="16" x2="14" y2="21"/>
    <line x1="6" y1="25" x2="14" y2="11"/>
    <line x1="6" y1="25" x2="14" y2="21"/>
    <line x1="14" y1="11" x2="26" y2="10"/>
    <line x1="14" y1="11" x2="26" y2="22"/>
    <line x1="14" y1="21" x2="26" y2="10"/>
    <line x1="14" y1="21" x2="26" y2="22"/>
  </g>
  <!-- Input nodes -->
  <circle cx="6" cy="7" r="2.2" fill="currentColor"/>
  <circle cx="6" cy="16" r="2.2" fill="currentColor"/>
  <circle cx="6" cy="25" r="2.2" fill="currentColor"/>
  <!-- Hidden nodes -->
  <circle cx="14" cy="11" r="2.6" fill="none"/>
  <circle cx="14" cy="21" r="2.6" fill="none"/>
  <!-- Output nodes -->
  <circle cx="26" cy="10" r="2.2" fill="currentColor"/>
  <circle cx="26" cy="22" r="2.2" fill="currentColor"/>
</svg>
