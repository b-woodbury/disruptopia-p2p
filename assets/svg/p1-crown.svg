<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="28" height="28" role="img" aria-label="First player crown">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <!-- Crown body: three points -->
  <path d="M3 22 L 4 10 L 9 16 L 14 6 L 19 16 L 24 10 L 25 22 Z"
        fill="url(#gold)" stroke="#92400e" stroke-width="1" stroke-linejoin="round"/>
  <!-- Band -->
  <rect x="3" y="20" width="22" height="4" rx="0.7" fill="url(#band)" stroke="#92400e" stroke-width="0.8"/>
  <!-- Jewels on points -->
  <circle cx="4.2" cy="10" r="1.4" fill="#dc2626" stroke="#7f1d1d" stroke-width="0.4"/>
  <circle cx="14" cy="6" r="1.6" fill="#3b82f6" stroke="#1e3a8a" stroke-width="0.4"/>
  <circle cx="23.8" cy="10" r="1.4" fill="#10b981" stroke="#065f46" stroke-width="0.4"/>
  <!-- Band jewel -->
  <circle cx="14" cy="22" r="1.2" fill="#fef3c7" stroke="#92400e" stroke-width="0.4"/>
  <!-- Highlight -->
  <path d="M5 11 Q 7 13 8.5 14" stroke="#fef3c7" stroke-width="0.8" fill="none" stroke-opacity="0.6" stroke-linecap="round"/>
</svg>
