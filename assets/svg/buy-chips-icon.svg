<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Buy chips" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Outer chip body -->
  <rect x="7" y="7" width="18" height="18" rx="1.5" fill="none"/>
  <!-- Inner die -->
  <rect x="11" y="11" width="10" height="10" rx="0.8" fill="currentColor" fill-opacity="0.18"/>
  <!-- Pins: top, bottom, left, right (3 each) -->
  <g stroke-width="1.6">
    <line x1="11" y1="4" x2="11" y2="7"/>
    <line x1="16" y1="4" x2="16" y2="7"/>
    <line x1="21" y1="4" x2="21" y2="7"/>
    <line x1="11" y1="25" x2="11" y2="28"/>
    <line x1="16" y1="25" x2="16" y2="28"/>
    <line x1="21" y1="25" x2="21" y2="28"/>
    <line x1="4" y1="11" x2="7" y2="11"/>
    <line x1="4" y1="16" x2="7" y2="16"/>
    <line x1="4" y1="21" x2="7" y2="21"/>
    <line x1="25" y1="11" x2="28" y2="11"/>
    <line x1="25" y1="16" x2="28" y2="16"/>
    <line x1="25" y1="21" x2="28" y2="21"/>
  </g>
  <!-- Notch marker -->
  <circle cx="10" cy="10" r="0.9" fill="currentColor"/>
</svg>
