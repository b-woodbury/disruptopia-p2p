<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 60" width="600" height="60" role="img" aria-label="Victory Points track (0-30)">
  <defs>
    <linearGradient id="vpbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#e9e2d3"/>
    </linearGradient>
    <linearGradient id="vpmile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Outer strip -->
  <rect x="2" y="6" width="596" height="48" rx="12" fill="url(#vpbg)" stroke="#d4c9b8" stroke-width="1.5"/>

  <!-- 31 positions: x = 12 + i * (576 / 30) -->
  <!-- Loop unrolled inline; spacing = 19.2 px between centres -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">
    <!-- Generated positions 0..30 -->
    <!-- Helper: cx = 18 + i*18.8 -->
    <!-- Milestones every 5 (0,5,10,15,20,25,30): big indigo circle, r=11 -->
    <!-- Regular: small cream circle, r=6 -->

    <!-- 0 -->
    <circle cx="18" cy="30" r="11" fill="url(#vpmile)" stroke="#3730a3" stroke-width="1.2"/>
    <text x="18" y="34" fill="#faf7f2" font-size="11">0</text>
    <!-- 1..4 -->
    <circle cx="36.8" cy="30" r="6" fill="#faf7f2" stroke="#d4c9b8" stroke-width="1"/>
    <text x="36.8" y="33" fill="#78716c" font-size="8">1</text>
    <circle cx="55.6" cy="30" r="6" fill="#faf7f2" stroke="#d4c9b8" stroke-width="1"/>
    <text x="55.6" y="33" fill="#78716c" font-size="8">2</text>
    <circle cx="74.4" cy="30" r="6" fill="#faf7f2" stroke="#d4c9b8" stroke-width="1"/>
    <text x="74.4" y="33" fill="#78716c" font-size="8">3</text>
    <circle cx="93.2" cy="30" r="6" fill="#faf7f2" stroke="#d4c9b8" stroke-width="1"/>
    <text x="93.2" y="33" fill="#78716c" font-size="8">4</text>
    <!-- 5 -->
    <circle cx="112" cy="30" r="11" fill="url(#vpmile)" stroke="#3730a3" stroke-width="1.2"/>
    <text x="112" y="34" fill="#faf7f2" font-size="11">5</text>
    <!-- 6..9 -->
    <circle cx="130.8" cy="30" r="6" fill="#faf7f2" stroke="#d4c9b8" stroke-width="1"/>
    <text x="130.8" y="33" fill="#78716c" font-size="8">6</text>
    <circle cx="149.6" cy="30" r="6" fill="#faf7f2" stroke="#d4c9b8" stroke-width="1"/>
    <text x="149.6" y="33" fill="#78716c" font-size="8">7</text>
    <circle cx="168.4" cy="30" r="6" fill="#faf7f2" stroke="#d4c9b8" stroke-width="1"/>
    <text x="168.4" y="33" fill="#78716c" font-size="8">8</text>
    <circle cx="187.2" cy="30" r="6" fill="#faf7f2" stroke="#d4c9b8" stroke-width="1"/>
    <text x="187.2" y="33" fill="#78716c" font-size="8">9</text>
    <!-- 10 -->
    <circle cx="206" cy="30" r="11" fill="url(#vpmile)" stroke="#3730a3" stroke-width="1.2"/>
    <text x="206" y="34" fill="#faf7f2" font-size="11">10</text>
    <!-- 11..14 -->
    <circle cx="224.8" cy="30" r="6" fill="#faf7f2" stroke="#d4c9b8" stroke-width="1"/>
    <text x="224.8" y="33" fill="#78716c" font-size="8">11</text>
    <circle cx="243.6" cy="30" r="6" fill="#faf7f2" stroke="#d4c9b8" stroke-width="1"/>
    <text x="243.6" y="33" fill="#78716c" font-size="8">12</text>
    <circle cx="262.4" cy="30" r="6" fill="#faf7f2" stroke="#d4c9b8" stroke-width="1"/>
    <text x="262.4" y="33" fill="#78716c" font-size="8">13</text>
    <circle cx="281.2" cy="30" r="6" fill="#faf7f2" stroke="#d4c9b8" stroke-width="1"/>
    <text x="281.2" y="33" fill="#78716c" font-size="8">14</text>
    <!-- 15 -->
    <circle cx="300" cy="30" r="11" fill="url(#vpmile)" stroke="#3730a3" stroke-width="1.2"/>
    <text x="300" y="34" fill="#faf7f2" font-size="11">15</text>
    <!-- 16..19 -->
    <circle cx="318.8" cy="30" r="6" fill="#faf7f2" stroke="#d4c9b8" stroke-width="1"/>
    <text x="318.8" y="33" fill="#78716c" font-size="8">16</text>
    <circle cx="337.6" cy="30" r="6" fill="#faf7f2" stroke="#d4c9b8" stroke-width="1"/>
    <text x="337.6" y="33" fill="#78716c" font-size="8">17</text>
    <circle cx="356.4" cy="30" r="6" fill="#faf7f2" stroke="#d4c9b8" stroke-width="1"/>
    <text x="356.4" y="33" fill="#78716c" font-size="8">18</text>
    <circle cx="375.2" cy="30" r="6" fill="#faf7f2" stroke="#d4c9b8" stroke-width="1"/>
    <text x="375.2" y="33" fill="#78716c" font-size="8">19</text>
    <!-- 20 -->
    <circle cx="394" cy="30" r="11" fill="url(#vpmile)" stroke="#3730a3" stroke-width="1.2"/>
    <text x="394" y="34" fill="#faf7f2" font-size="11">20</text>
    <!-- 21..24 -->
    <circle cx="412.8" cy="30" r="6" fill="#faf7f2" stroke="#d4c9b8" stroke-width="1"/>
    <text x="412.8" y="33" fill="#78716c" font-size="8">21</text>
    <circle cx="431.6" cy="30" r="6" fill="#faf7f2" stroke="#d4c9b8" stroke-width="1"/>
    <text x="431.6" y="33" fill="#78716c" font-size="8">22</text>
    <circle cx="450.4" cy="30" r="6" fill="#faf7f2" stroke="#d4c9b8" stroke-width="1"/>
    <text x="450.4" y="33" fill="#78716c" font-size="8">23</text>
    <circle cx="469.2" cy="30" r="6" fill="#faf7f2" stroke="#d4c9b8" stroke-width="1"/>
    <text x="469.2" y="33" fill="#78716c" font-size="8">24</text>
    <!-- 25 -->
    <circle cx="488" cy="30" r="11" fill="url(#vpmile)" stroke="#3730a3" stroke-width="1.2"/>
    <text x="488" y="34" fill="#faf7f2" font-size="11">25</text>
    <!-- 26..29 -->
    <circle cx="506.8" cy="30" r="6" fill="#faf7f2" stroke="#d4c9b8" stroke-width="1"/>
    <text x="506.8" y="33" fill="#78716c" font-size="8">26</text>
    <circle cx="525.6" cy="30" r="6" fill="#faf7f2" stroke="#d4c9b8" stroke-width="1"/>
    <text x="525.6" y="33" fill="#78716c" font-size="8">27</text>
    <circle cx="544.4" cy="30" r="6" fill="#faf7f2" stroke="#d4c9b8" stroke-width="1"/>
    <text x="544.4" y="33" fill="#78716c" font-size="8">28</text>
    <circle cx="563.2" cy="30" r="6" fill="#faf7f2" stroke="#d4c9b8" stroke-width="1"/>
    <text x="563.2" y="33" fill="#78716c" font-size="8">29</text>
    <!-- 30 with crown -->
    <circle cx="582" cy="30" r="12" fill="url(#vpmile)" stroke="#3730a3" stroke-width="1.4"/>
    <text x="582" y="34" fill="#faf7f2" font-size="11">30</text>
    <g transform="translate(582 12)" stroke="#92400e" stroke-width="0.5">
      <path d="M-6 4 L -4 -3 L -1 1 L 0 -5 L 1 1 L 4 -3 L 6 4 Z" fill="#fbbf24"/>
    </g>
  </g>
</svg>
