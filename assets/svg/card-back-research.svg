<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280" role="img" aria-label="Research card back">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="0.5" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="rglow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rgrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 L 0 0 0 20" stroke="#14b8a6" stroke-width="0.5" fill="none" stroke-opacity="0.35"/>
    </pattern>
  </defs>
  <!-- Card body -->
  <rect x="0" y="0" width="200" height="280" rx="14" fill="url(#rbg)"/>
  <rect x="0" y="0" width="200" height="280" rx="14" fill="url(#rgrid)"/>
  <rect x="0" y="0" width="200" height="280" rx="14" fill="url(#rglow)"/>
  <!-- Inner border -->
  <rect x="8" y="8" width="184" height="264" rx="9" fill="none" stroke="#faf7f2" stroke-width="1.2" stroke-opacity="0.55"/>
  <rect x="12" y="12" width="176" height="256" rx="7" fill="none" stroke="#faf7f2" stroke-width="0.6" stroke-opacity="0.35"/>

  <!-- Neural network motif -->
  <g transform="translate(100 130)" stroke="#faf7f2" stroke-width="1.2" fill="none">
    <!-- Connection lines -->
    <g stroke-opacity="0.55">
      <line x1="-50" y1="-40" x2="0" y2="-15"/>
      <line x1="-50" y1="-40" x2="0" y2="15"/>
      <line x1="-50" y1="0" x2="0" y2="-15"/>
      <line x1="-50" y1="0" x2="0" y2="15"/>
      <line x1="-50" y1="40" x2="0" y2="-15"/>
      <line x1="-50" y1="40" x2="0" y2="15"/>
      <line x1="0" y1="-15" x2="50" y2="-30"/>
      <line x1="0" y1="-15" x2="50" y2="0"/>
      <line x1="0" y1="-15" x2="50" y2="30"/>
      <line x1="0" y1="15" x2="50" y2="-30"/>
      <line x1="0" y1="15" x2="50" y2="0"/>
      <line x1="0" y1="15" x2="50" y2="30"/>
    </g>
    <!-- Nodes (input) -->
    <g fill="#5eead4" stroke="#0f766e">
      <circle cx="-50" cy="-40" r="7"/>
      <circle cx="-50" cy="0" r="7"/>
      <circle cx="-50" cy="40" r="7"/>
    </g>
    <!-- Nodes (hidden) - highlight -->
    <g fill="#fef3c7" stroke="#0f766e">
      <circle cx="0" cy="-15" r="8"/>
      <circle cx="0" cy="15" r="8"/>
    </g>
    <!-- Nodes (output) -->
    <g fill="#5eead4" stroke="#0f766e">
      <circle cx="50" cy="-30" r="7"/>
      <circle cx="50" cy="0" r="7"/>
      <circle cx="50" cy="30" r="7"/>
    </g>
  </g>

  <!-- Title banner -->
  <rect x="20" y="232" width="160" height="30" rx="4" fill="#0f766e" stroke="#faf7f2" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="100" y="252" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="16" font-weight="bold" fill="#faf7f2" letter-spacing="3">RESEARCH</text>

  <!-- Corner accents -->
  <g fill="#5eead4" fill-opacity="0.7">
    <circle cx="20" cy="20" r="2.5"/>
    <circle cx="180" cy="20" r="2.5"/>
    <circle cx="20" cy="220" r="2.5"/>
    <circle cx="180" cy="220" r="2.5"/>
  </g>
</svg>
