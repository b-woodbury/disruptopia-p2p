<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Disruptopia World Map — Hexagon Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#4f46e5; --accent:#7c3aed;
    --cream:#f0ece3; --card:#faf7f2; --border:#d4c9b8;
    --text:#1e1b18; --muted:#78716c;
    --money:#16a34a; --subsidy:#d97706;
    --p-red:#ef4444; --p-blue:#3b82f6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Space Grotesk',sans-serif;
    background:var(--cream);
    color:var(--text);
    display:flex;flex-direction:column;
    min-height:100vh;
  }
  header{
    background:linear-gradient(90deg,var(--primary),var(--accent));
    color:#fff;
    padding:18px 28px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
  }
  header h1{font-weight:700;font-size:22px;letter-spacing:.3px}
  header p{font-weight:400;font-size:13px;opacity:.85;margin-top:4px}
  main{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
  }
  .map-wrap{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:0 8px 30px rgba(30,27,24,.08);
    padding:18px;
    position:relative;
    width:100%;
    max-width:1080px;
  }
  svg.map{display:block;width:100%;height:auto}

  .hex{cursor:pointer;transition:transform .18s ease, filter .18s ease;transform-origin:center;transform-box:fill-box}
  .hex:hover{transform:scale(1.06);filter:drop-shadow(0 6px 14px rgba(79,70,229,.4))}
  .hex polygon{stroke:#fff;stroke-width:3;stroke-linejoin:round}
  .hex-label{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;font-size:12px;
    fill:#fff;
    pointer-events:none;
    text-anchor:middle;
  }
  .hex-idx{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;font-size:18px;
    fill:#fff;
    pointer-events:none;
    text-anchor:middle;
    opacity:.9;
  }
  .adj-line{
    stroke:#7c3aed;
    stroke-width:2;
    fill:none;
    opacity:.35;
  }

  .legend{
    position:absolute;
    right:30px;
    bottom:30px;
    background:rgba(250,247,242,.95);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    font-size:12px;
    line-height:1.6;
    box-shadow:0 4px 14px rgba(0,0,0,.06);
  }
  .legend h3{font-size:13px;font-weight:700;margin-bottom:6px;color:var(--primary)}
  .legend .row{display:flex;align-items:center;gap:8px}
  .swatch{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
  .swatch.red{background:var(--p-red)}
  .swatch.blue{background:var(--p-blue)}
  .swatch.sub{background:var(--subsidy);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:9px;border:none}
  .swatch.hex-mini{width:18px;height:16px;background:linear-gradient(135deg,#7c3aed,#4f46e5);border:none;clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);border-radius:0}
</style>
</head>
<body>
<header>
  <h1>Disruptopia World Map &mdash; Hexagon Concept</h1>
  <p>Tessellated tile prototype &middot; 10 regions &middot; flat-top hexagons</p>
</header>
<main>
  <div class="map-wrap">
    <svg class="map" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg">
      <!--
        Flat-top hex geometry: width=2r, height=r*sqrt(3)≈r*1.732
        r=60 -> w=120, h≈104
        Horizontal step between hex centers: 1.5*r = 90
        Vertical step (offset rows): r*sqrt(3)/2 ≈ 52
        Hex points (centered at cx,cy, r=60):
          (cx-60,cy)(cx-30,cy-52)(cx+30,cy-52)(cx+60,cy)(cx+30,cy+52)(cx-30,cy+52)
      -->
      <defs>
        <linearGradient id="lg0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a5b4fc"/><stop offset="1" stop-color="#4338ca"/></linearGradient>
        <linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
        <linearGradient id="lg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fda4af"/><stop offset="1" stop-color="#be123c"/></linearGradient>
        <linearGradient id="lg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#c2410c"/></linearGradient>
        <linearGradient id="lg4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#15803d"/></linearGradient>
        <linearGradient id="lg5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
        <linearGradient id="lg6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0369a1"/></linearGradient>
        <linearGradient id="lg7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#b45309"/></linearGradient>
        <linearGradient id="lg8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9a8d4"/><stop offset="1" stop-color="#9d174d"/></linearGradient>
        <linearGradient id="lg9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#92400e"/></linearGradient>

        <pattern id="hexbg" width="30" height="26" patternUnits="userSpaceOnUse">
          <rect width="30" height="26" fill="#faf7f2"/>
          <path d="M0 13 L7.5 0 L22.5 0 L30 13 L22.5 26 L7.5 26 Z" fill="none" stroke="#ece4d2" stroke-width="0.6"/>
        </pattern>
      </defs>

      <rect x="0" y="0" width="1000" height="620" fill="url(#hexbg)" rx="14"/>

      <!--
        Hex centers (flat-top, r=60):
        Row A (y=140): 0 NW Americas (140), 1 NE Americas (260,192), 2 W Europe (470,140), 3 E Europe (590,192), 4 NE Asia (800,140)
        Actually use offset-coord layout: x = 110 + col*90, y = 140 (odd-col +52)
        col0=110, col1=200, col2=290, col3=380, col4=470, col5=560, col6=650, col7=740, col8=830, col9=920
      -->

      <!-- Adjacency lines connecting hex centers (drawn first) -->
      <g class="adjacencies">
        <!-- centers:
             0 NW Americas (110,140) 1 NE Americas (200,192) 2 W Europe (470,140) 3 E Europe (560,192) 4 NE Asia (830,140)
             5 W Americas (200,296)  6 S America   (200,504) 7 Africa    (470,452) 8 Middle East (560,348) 9 SE Asia (830,348)
        -->
        <line class="adj-line" x1="110" y1="140" x2="200" y2="192"/>
        <line class="adj-line" x1="110" y1="140" x2="200" y2="296"/>
        <line class="adj-line" x1="200" y1="192" x2="470" y2="140"/>
        <line class="adj-line" x1="200" y1="192" x2="200" y2="504"/>
        <line class="adj-line" x1="470" y1="140" x2="560" y2="192"/>
        <line class="adj-line" x1="470" y1="140" x2="470" y2="452"/>
        <line class="adj-line" x1="560" y1="192" x2="830" y2="140"/>
        <line class="adj-line" x1="560" y1="192" x2="560" y2="348"/>
        <line class="adj-line" x1="830" y1="140" x2="830" y2="348"/>
        <line class="adj-line" x1="200" y1="296" x2="200" y2="504"/>
        <line class="adj-line" x1="200" y1="504" x2="470" y2="452"/>
        <line class="adj-line" x1="470" y1="452" x2="560" y2="348"/>
        <line class="adj-line" x1="560" y1="348" x2="830" y2="348"/>
      </g>

      <!-- HEXAGONS -->
      <g class="hexes">
        <!-- 0 NW Americas (110,140) -->
        <g class="hex" onclick="alert('NW Americas (region 0)')">
          <polygon points="50,140 80,88 140,88 170,140 140,192 80,192" fill="url(#lg0)"/>
          <text class="hex-idx" x="110" y="135">0</text>
          <text class="hex-label" x="110" y="158">NW Americas</text>
        </g>
        <!-- 1 NE Americas (200,192) -->
        <g class="hex" onclick="alert('NE Americas (region 1)')">
          <polygon points="140,192 170,140 230,140 260,192 230,244 170,244" fill="url(#lg1)"/>
          <text class="hex-idx" x="200" y="187">1</text>
          <text class="hex-label" x="200" y="210">NE Americas</text>
        </g>
        <!-- 5 W Americas (200,296) -->
        <g class="hex" onclick="alert('W Americas (region 5)')">
          <polygon points="140,296 170,244 230,244 260,296 230,348 170,348" fill="url(#lg5)"/>
          <text class="hex-idx" x="200" y="291">5</text>
          <text class="hex-label" x="200" y="314">W Americas</text>
        </g>
        <!-- 6 S America (200,504) -->
        <g class="hex" onclick="alert('S America (region 6)')">
          <polygon points="140,504 170,452 230,452 260,504 230,556 170,556" fill="url(#lg6)"/>
          <text class="hex-idx" x="200" y="499">6</text>
          <text class="hex-label" x="200" y="522">S America</text>
        </g>
        <!-- 2 W Europe (470,140) -->
        <g class="hex" onclick="alert('W Europe (region 2)')">
          <polygon points="410,140 440,88 500,88 530,140 500,192 440,192" fill="url(#lg2)"/>
          <text class="hex-idx" x="470" y="135">2</text>
          <text class="hex-label" x="470" y="158">W Europe</text>
        </g>
        <!-- 3 E Europe (560,192) -->
        <g class="hex" onclick="alert('E Europe (region 3)')">
          <polygon points="500,192 530,140 590,140 620,192 590,244 530,244" fill="url(#lg3)"/>
          <text class="hex-idx" x="560" y="187">3</text>
          <text class="hex-label" x="560" y="210">E Europe</text>
        </g>
        <!-- 8 Middle East (560,348) -->
        <g class="hex" onclick="alert('Middle East (region 8)')">
          <polygon points="500,348 530,296 590,296 620,348 590,400 530,400" fill="url(#lg8)"/>
          <text class="hex-idx" x="560" y="343">8</text>
          <text class="hex-label" x="560" y="366">Middle East</text>
        </g>
        <!-- 7 Africa (470,452) -->
        <g class="hex" onclick="alert('Africa (region 7)')">
          <polygon points="410,452 440,400 500,400 530,452 500,504 440,504" fill="url(#lg7)"/>
          <text class="hex-idx" x="470" y="447">7</text>
          <text class="hex-label" x="470" y="470">Africa</text>
        </g>
        <!-- 4 NE Asia (830,140) -->
        <g class="hex" onclick="alert('NE Asia (region 4)')">
          <polygon points="770,140 800,88 860,88 890,140 860,192 800,192" fill="url(#lg4)"/>
          <text class="hex-idx" x="830" y="135">4</text>
          <text class="hex-label" x="830" y="158">NE Asia</text>
        </g>
        <!-- 9 SE Asia (830,348) -->
        <g class="hex" onclick="alert('SE Asia (region 9)')">
          <polygon points="770,348 800,296 860,296 890,348 860,400 800,400" fill="url(#lg9)"/>
          <text class="hex-idx" x="830" y="343">9</text>
          <text class="hex-label" x="830" y="366">SE Asia</text>
        </g>
      </g>

      <!-- PLAYER PRESENCE MARKERS -->
      <g class="presence" pointer-events="none">
        <!-- Red on NW Americas (2 stacked) -->
        <circle cx="90" cy="170" r="10" fill="#ef4444" stroke="#fff" stroke-width="2"/>
        <circle cx="108" cy="178" r="10" fill="#ef4444" stroke="#fff" stroke-width="2"/>
        <!-- Blue on W Europe -->
        <circle cx="448" cy="172" r="10" fill="#3b82f6" stroke="#fff" stroke-width="2"/>
        <!-- Contested: Africa -->
        <circle cx="455" cy="480" r="10" fill="#3b82f6" stroke="#fff" stroke-width="2"/>
        <circle cx="475" cy="486" r="10" fill="#ef4444" stroke="#fff" stroke-width="2"/>
      </g>

      <!-- SUBSIDY on NE Asia -->
      <g pointer-events="none">
        <circle cx="868" cy="112" r="14" fill="#d97706" stroke="#fff" stroke-width="2"/>
        <text x="868" y="117" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">S</text>
      </g>
    </svg>

    <div class="legend">
      <h3>Legend</h3>
      <div class="row"><span class="swatch hex-mini"></span><span>Region tile (clickable)</span></div>
      <div class="row"><span class="swatch red"></span><span>Player 1 presence</span></div>
      <div class="row"><span class="swatch blue"></span><span>Player 2 presence</span></div>
      <div class="row"><span class="swatch sub">S</span><span>Subsidy token</span></div>
    </div>
  </div>
</main>
</body>
</html>
